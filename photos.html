<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photos - Gary Hoaks</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: hwb(206 91% 6%);
      padding: 40px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-top: 16px;
    }
    h2 {
      color: #fe5a1d;
      margin-top: 32px;
    }

      color: #555;

    .gallery {
      display: flex;
      flex-wrap: wrap;

    a {
      color: #4f46e5;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    button {
      margin-top: 24px;
      padding: 10px 16px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #fe5a1d;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button2 {
      margin-top: 24px;
      padding: 10px 16px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #050008;
      color: #fffefe;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .top-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .back-link {
      margin-top: 40px;
      display: inline-block;
    }

  </style>
</head>
<body>
  <div class="top-links">
    <button onclick="window.location.href='index.html'">Home</button>
    <button2 onclick="window.location.href='photos.html'">Photos</button2>
